[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "equa-cfd-viewer"
dynamic = ["version"]
description = "Browser post-processing for OpenFOAM cases: a Python/VTK extraction server behind a React + three.js client."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # The stock wheels carry their own EGL/OSMesa render windows and dlopen
    # them; the server never renders, so it needs no GL library (CLAUDE.md,
    # "VTK packaging").
    "vtk>=9.4",
    "aiohttp>=3.9",
    "numpy>=1.26",
    # Colour-map tables (foamviz/colors.py). VTK depends on it too, so it is in
    # every deployment either way (openspec standalone-viewer, design D10).
    "matplotlib>=3.8",
]

[project.scripts]
cfd-viewer = "equa.cfd_viewer.__main__:main"

[dependency-groups]
dev = [
    # Build tooling, not runtime: only dodo.py imports equa.ci. Declared as a
    # runtime dependency it would ride into every consumer's environment along
    # with doit, mypy, ruff and pre-commit, and would force any container image
    # built from this package to authenticate to a private feed.
    "equa-ci>=1.0.0b77",
    "build>=1.2",
    "hatch-vcs>=0.4",
    "pytest>=8",
    "ruff>=0.6.0",
    # tests/check_client.py drives Chromium and reads screenshots.
    "playwright>=1.45",
    "pillow>=10",
]
# The Windows bundle's freezer, pinned so Renovate proposes its updates and the
# windows CI job tests them before they merge (openspec local-desktop-viewer, D4).
# Not in the default sync: only that job installs it.
freeze = [
    "pyinstaller==6.22.3",
]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/equa"]

[tool.hatch.build.targets.wheel.hooks.custom]
# hatch_build.py: puts the built client (web/dist) into the wheel as
# equa/cfd_viewer/web, and refuses to build a release wheel without it.

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
markers = [
    "browser: the Chromium suite (tests/check_client.py); doit test_ui runs it, test_py does not",
]

[tool.uv.sources]
equa-ci = { index = "equa-dev" }

[[tool.uv.index]]
name = "equa-dev"
url = "https://pkgs.dev.azure.com/EQUADevelopment/_packaging/equa-dev/pypi/simple/"
# Only for what [tool.uv.sources] pins to it (equa-ci, dev only): the image build
# has no feed credentials, and uv stops at an index that answers 401.
explicit = true

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
